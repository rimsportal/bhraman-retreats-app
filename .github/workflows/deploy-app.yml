name: Deploy Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency: deploy-${{ inputs.environment || 'dev' }}

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  ACR_NAME: acrbhrretcin

jobs:
  # ── STAGE 1: BUILD & PUSH CONTAINER (GHA Layer Cached) ──
  build-and-push-image:
    name: "1. Build & Push Container (GHA Cached)"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push container image with GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/bhraman-retreats:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/bhraman-retreats:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ── STAGE 2: DATABASE MIGRATION (Smart Path Filter) ──
  migrate-database:
    name: "2. Apply Database Migrations"
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository (fetch history for diff check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if migrations changed
        id: filter
        run: |
          # Check if prisma migrations or schema were modified in this commit
          if git diff --name-only HEAD~1 HEAD | grep -E '^prisma/(migrations|schema\.prisma)'; then
            echo "migrations_changed=true" >> $GITHUB_OUTPUT
            echo "Database migrations detected in this commit."
          else
            echo "migrations_changed=false" >> $GITHUB_OUTPUT
            echo "⏩ No database migrations changed. Skipping firewall and database steps."
          fi

      - name: Azure login (OIDC)
        if: steps.filter.outputs.migrations_changed == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup pnpm
        if: steps.filter.outputs.migrations_changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js (with pnpm cache)
        if: steps.filter.outputs.migrations_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.migrations_changed == 'true'
        run: pnpm install --frozen-lockfile --config.ignore-scripts=true

      - name: Apply Prisma database migrations
        if: steps.filter.outputs.migrations_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          # Extract database host and server name from DATABASE_URL
          HOST=$(echo "$DATABASE_URL" | sed -E 's/.*@([^:/]+).*/\1/')
          SERVER=$(echo "$HOST" | cut -d'.' -f1)

          echo "Target DB Server: $SERVER ($HOST)"

          # Dynamically locate the Resource Group for the server
          RG=$(az postgres flexible-server list --query "[?name=='$SERVER'].resourceGroup | [0]" -o tsv 2>/dev/null || echo "")

          if [ -n "$RG" ] && [ "$RG" != "None" ]; then
            IP="$(curl -s https://api.ipify.org)"
            RULE="gh-deploy-${GITHUB_RUN_ID}"
            echo "Attempting temporary firewall rule for runner IP ($IP) on $SERVER in $RG..."
            az postgres flexible-server firewall-rule create \
              --resource-group "$RG" \
              --server-name "$SERVER" \
              --name "$RULE" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" 2>/dev/null || true

            trap 'az postgres flexible-server firewall-rule delete --resource-group "$RG" --server-name "$SERVER" --name "$RULE" --yes 2>/dev/null || true' EXIT
          fi

          pnpm prisma db push --skip-generate || pnpm prisma migrate deploy

  # ── STAGE 3: RESTART APP SERVICE ──
  deploy-app:
    name: "3. Restart App Service"
    needs: [migrate-database]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Restart web app to pull new image
        run: |
          set -euo pipefail
          RG="rg-bhr-ret-${ENVIRONMENT}-cin"
          APP="app-bhr-ret-${ENVIRONMENT}-cin"
          az webapp restart --name "$APP" --resource-group "$RG"
          echo "Successfully deployed ${ACR_NAME}.azurecr.io/bhraman-retreats:latest -> https://$APP.azurewebsites.net"
